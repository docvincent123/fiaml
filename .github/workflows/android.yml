name: RehaFlow Android APK
on:
  push:
    branches: [main, codex/desktop-installer-roles]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Build installable test APK and run lint
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: RehaFlow-Android-test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && github.ref == 'refs/heads/main'
        with:
          name: Android-lint
          path: android/app/build/reports/lint-results-debug.html

      - name: Save tested APK as draft release
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/desktop-installer-roles'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="android-preview-${GITHUB_SHA:0:12}"
          printf '%s\n' 'Debug-signed test APK with app icon and local certificate setup help. See docs/STAFF-2.2.md and docs/INSTALLER-2.1.md; real-device pairing still requires verification.' > /tmp/rehaflow-release-notes.txt
          gh release create "$release_tag" android/app/build/outputs/apk/debug/app-debug.apk --draft --target "$GITHUB_SHA" --title 'RehaFlow 2.2 - Android test build' --notes-file /tmp/rehaflow-release-notes.txt
