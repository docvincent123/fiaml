name: QureMed build and tests
on:
  push:
    branches: [main, codex/desktop-installer-roles]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server-web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: quremed_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/quremed_test
      - name: Build local server image
        run: docker build -t quremed-local .
      - name: Smoke test local server image
        run: |
          docker run -d --name quremed-smoke --network host -e DATABASE_URL=postgres://postgres:postgres@localhost:5432/quremed_test -e JWT_SECRET=ci-only-secret-at-least-thirty-two-characters -e ADMIN_PASSWORD=Testing-Only-Password-2026 -e PUBLIC_URL=http://127.0.0.1:3000 -e NODE_ENV=test quremed-local
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then break; fi
            sleep 2
          done
          node scripts/smoke-server.mjs
      - name: Server diagnostics
        if: failure()
        run: docker logs quremed-smoke || true
      - name: Package local server sources
        run: git archive --format=zip --output=QureMed-Local-Server.zip HEAD
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: QureMed-Local-Server
          path: QureMed-Local-Server.zip
          retention-days: 7
  windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify installer configuration and recovery on Windows PowerShell
        shell: powershell
        run: |
          ./scripts/Test-NoDockerConfig.ps1
          ./scripts/Test-ServerNetwork.ps1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build -w web
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish native WinUI desktop
        run: dotnet publish desktop/QureMed.Desktop/QureMed.Desktop.csproj -c Release -r win-x64 -p:Platform=x64 --self-contained true -o artifacts/desktop
      - name: Build Windows installer
        shell: pwsh
        run: |
          Copy-Item scripts/Configure-Client.ps1 artifacts/desktop/Configure-Client.ps1
          git archive --format=zip --output=artifacts/server-source.zip HEAD
          Expand-Archive artifacts/server-source.zip artifacts/server-source
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) { throw 'Inno Setup compiler missing from runner' }
          & $compiler installer/RehaFlow.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Verify installer client mode
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'RehaFlow Installer Test'
          $installer = Start-Process artifacts/installer/RehaFlow-Setup-x64.exe -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TYPE=client',('/DIR="' + $installDir + '"')) -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer failed: $($installer.ExitCode)" }
          foreach ($file in @('RehaFlow.exe','RehaFlow.pri','Assets/RehaFlow.ico','Configure-Client.ps1')) {
            if (-not (Test-Path (Join-Path $installDir $file))) { throw "Installed file missing: $file" }
          }
          if (Test-Path 'C:/ProgramData/QureMed/Server/.env.nodocker') { throw 'Client mode created server configuration' }
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: RehaFlow-Windows-Installer
          path: artifacts/installer/RehaFlow-Setup-x64.exe
          if-no-files-found: error
          retention-days: 14
      - name: Check desktop executable
        shell: pwsh
        run: |
          if (-not (Test-Path artifacts/desktop/RehaFlow.exe)) { throw 'RehaFlow.exe not produced' }
          if (-not (Test-Path artifacts/desktop/RehaFlow.pri)) { throw 'Application resource index RehaFlow.pri not published' }
          Copy-Item README.md artifacts/desktop/README.md
      - name: Parse local PowerShell scripts
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $parseErrors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
      - name: React desktop startup and readiness
        id: desktop-smoke
        shell: pwsh
        run: |
          $startupLog = Join-Path $env:LOCALAPPDATA 'QureMed/startup.log'
          if (Test-Path $startupLog) { Remove-Item $startupLog }
          $previewProcess = Start-Process node -ArgumentList 'scripts/desktop-preview.mjs' -PassThru
          $env:QUREMED_SERVER_URL = 'http://127.0.0.1:8787'
          $desktopProcess = $null
          try {
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              try { $null = Invoke-RestMethod "$env:QUREMED_SERVER_URL/api/health"; break } catch { Start-Sleep -Seconds 1 }
            }
            $desktopProcess = Start-Process -FilePath (Resolve-Path artifacts/desktop/RehaFlow.exe) -PassThru
            $ready = $false
            for ($attempt = 0; $attempt -lt 45; $attempt++) {
              Start-Sleep -Seconds 1
              $desktopProcess.Refresh()
              if ($desktopProcess.HasExited) { throw "RehaFlow exited during startup: $($desktopProcess.ExitCode)" }
              if ((Test-Path $startupLog) -and (Select-String -Path $startupLog -SimpleMatch 'React UI ready' -Quiet)) { $ready = $true; break }
            }
            if (-not $ready) { throw 'React UI did not report readiness inside WebView2.' }
            Write-Host 'PASS: native shell launched and real React production bundle mounted.'
          } finally {
            if ($desktopProcess -and -not $desktopProcess.HasExited) { Stop-Process -Id $desktopProcess.Id }
            Stop-Process -Id $previewProcess.Id -ErrorAction SilentlyContinue
          }
      - name: Desktop startup diagnostics
        if: failure()
        shell: pwsh
        run: |
          $startupLog = Join-Path $env:LOCALAPPDATA 'QureMed/startup.log'
          if (Test-Path $startupLog) { Get-Content $startupLog }
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-10)} -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -in @('Application Error','.NET Runtime','Windows Error Reporting') } |
            Select-Object -First 8 TimeCreated,ProviderName,Message | Format-List
          exit 0
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: RehaFlow-Windows-x64
          path: artifacts/desktop/
          retention-days: 7

      - name: Save tested desktop installers as draft release
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/desktop-installer-roles'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'desktop-preview-' + $env:GITHUB_SHA.Substring(0,12)
          Compress-Archive artifacts/desktop/* artifacts/RehaFlow-Windows-x64.zip
          Copy-Item artifacts/server-source.zip artifacts/QureMed-Local-Server.zip
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.txt'
          Set-Content -LiteralPath $notes -Value 'Test build: Windows installer, portable client and server source. See docs/OPERATIONS-2.3.md and docs/STAFF-2.2.md and docs/INSTALLER-2.1.md. Not code-signed; real-device server setup still requires verification.'
          gh release create $tag artifacts/installer/RehaFlow-Setup-x64.exe artifacts/RehaFlow-Windows-x64.zip artifacts/QureMed-Local-Server.zip --draft --target $env:GITHUB_SHA --title 'RehaFlow 2.5.2 - Windows test build' --notes-file $notes
          if ($LASTEXITCODE -ne 0) { throw 'Could not save draft release files' }
