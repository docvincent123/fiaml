plugins { id 'com.android.application' }
android {
    namespace 'com.quremed.rehaflow'
    compileSdk 35
    defaultConfig {
        applicationId 'com.quremed.rehaflow'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '2.3.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { debug { applicationIdSuffix '.test'; versionNameSuffix '-test' } }
}
